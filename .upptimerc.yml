# Upptime (https://upptime.js.org) configuration for the RansomLeak status page.
# Checks run from GitHub Actions every 5 minutes; incidents are GitHub issues;
# the static site deploys to GitHub Pages at https://status.ransomleak.com.

owner: ransomleak
repo: status

sites:
  - name: Website
    url: https://ransomleak.com
  - name: Application
    url: https://app.ransomleak.com
  - name: API
    url: https://app.ransomleak.com/health

status-website:
  cname: status.ransomleak.com
  name: RansomLeak Status
  logoUrl: https://ransomleak.com/android-chrome-192x192.png
  introTitle: "**RansomLeak** service status"
  introMessage: Live uptime monitoring and incident history for the RansomLeak security awareness training platform. Incidents are also communicated to tenant administrators by email.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://ransomleak.com
    - title: Security
      href: https://ransomleak.com/security-compliance
  theme: light

commitMessages:
  commitAuthorName: RansomLeak Status Bot
  commitAuthorEmail: support@ransomleak.com
